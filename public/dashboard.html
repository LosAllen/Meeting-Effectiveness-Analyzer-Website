<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host Dashboard</title>
    <link rel="stylesheet" href="./styles/index.css" />
    <link rel="stylesheet" href="./styles/dashboard.css" />
  </head>
  <body>
    <header class="dashHeader">
      <div>
        <h1 class="dashTitle">Host Dashboard</h1>
        <p class="muted">View past meetings, survey results, and transcript analysis.</p>
      </div>
      <div class="dashActions">
        <a class="btn" href="/meeting">Meeting page</a>
        <button id="logoutBtn" class="btn" type="button" style="display:none">Sign out</button>
      </div>
    </header>

    <main class="dashGrid" id="loginGate" style="display:none">
      <section class="card" style="grid-column:1 / -1">
        <strong>Sign in</strong>
        <p class="muted">Please enter your username to sign in.</p>
        <div class="row" style="margin-top: 10px; gap: 10px; align-items:center;">
          <input id="usernameInput" placeholder="Username" autocomplete="username" />
          <button id="loginBtn" class="primary" type="button">Sign in</button>
          <span id="loginStatus" class="muted"></span>
        </div>
      </section>
    </main>

    <main class="dashGrid" id="dashMain">
      <section class="card">
        <div class="rowBetween">
          <strong>Meetings</strong>
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>
        <div id="meetingsList" class="list"></div>
      </section>

      <section class="card">
        <strong>Selected meeting</strong>
        <div id="detail" class="detail"></div>

        <hr />

        <strong>Transcript analysis</strong>
        <p class="muted">Paste a transcript and click Analyze to generate a summary + suggestions (prototype).</p>
        <textarea id="transcript" rows="8" placeholder="Paste transcript here..."></textarea>
        <div class="row" style="margin-top: 10px; gap: 10px;">
          <button id="analyzeBtn" class="primary">Analyze transcript</button>
          <span id="analyzeStatus" class="muted"></span>
        </div>
        <div id="analysis" class="analysis"></div>
      </section>
    </main>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
